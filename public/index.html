<script src="./tables.js"></script>
<script src="./cards.js"></script>
<script>
/* ===== 统一自适应读取与回填 v3 =====
 * 每个块通过 data-api 声明接口地址，data-tpl 声明回填模板，
 * 由本段 JS 统一拉取、自适应解析 JSON 并填入对应块。
 * 可选属性：data-jsonp（JSONP 回调名）/ data-charset（脚本编码）
 */
var REQ_TIMEOUT = 10000;  /* 单个请求超时(ms) */
var BAIDU_WORKER = './cf-mt-worker.js';     /* 百度翻译代理 Worker（相对路径：需 Cloudflare 在本页域名（即 location.hostname）上把 /cf-mt-worker.js* 路由到该 Worker，才能同域调用）；留空则不翻译，退回静态表/英文 */
/* 规范链接：用本页域名对应的 origin 动态设置，避免硬编码部署域名 */
var _canon = document.getElementById('canonicalLink'); if (_canon) _canon.href = location.origin + '/';

function flatten(obj, prefix, out){
  out = out || {};
  if (obj && typeof obj === 'object' && !Array.isArray(obj)){
    var keys = Object.keys(obj);
    if (keys.length === 0){ out[prefix] = obj; }
    else { for (var i=0;i<keys.length;i++){ flatten(obj[keys[i]], prefix ? prefix+'.'+keys[i] : keys[i], out); } }
  } else { out[prefix] = obj; }
  return out;
}
/* 容错解析：纯 JSON -> JSONP/前缀包裹 -> 逐个大括号做配平扫描，取能解析出的最大对象 */
function safeJson(s){
  if (s && typeof s === 'object') return s;
  s = String(s);
  try { return JSON.parse(s); } catch(e){}
  var best = null, bestLen = 0;
  for (var i=0;i<s.length;i++){
    if (s.charAt(i) !== '{') continue;
    var depth=0, inStr=false, esc=false;
    for (var j=i;j<s.length;j++){
      var c = s.charAt(j);
      if (esc){ esc=false; continue; }
      if (c === '\\'){ esc=true; continue; }
      if (c === '"'){ inStr = !inStr; continue; }
      if (inStr) continue;
      if (c === '{') depth++;
      else if (c === '}'){
        depth--;
        if (depth === 0){
          var frag = s.slice(i, j+1);
          try {
            var o = JSON.parse(frag);
            if (o && typeof o === 'object' && frag.length > bestLen){ best = o; bestLen = frag.length; }
          } catch(e2){}
          break;
        }
      }
    }
  }
  return best;
}
function fmtVal(v){
  if (v === null || v === undefined) return '';
  if (Array.isArray(v)) return v.filter(function(x){ return x !== '' && x != null; }).join(' ');
  return (typeof v === 'object') ? '' : String(v);
}
/* 字段别名兜底（不含自身键，防止递归） */
/* 静态表（ALIASES / CN_COUNTRIES / CN_ISO2 / CN_PROV_GBT2260 / CN_ISP_ABBR 及其派生 CN_PROV_ABBREV）
 * 已外置到 ./tables.js，由下方 <script src> 在主线脚本前载入为全局变量。 */


/* 地理字段中文化：按字段类型选对应映射（仅匹配英文键，已中文源不误伤） */
var _lastProv = '';
function cnGeo(name, val){
  if (val === undefined || val === null || val === '') return val;
  var lc = String(name).split('.').pop().trim().toLowerCase();
  var v = String(val).trim();
  /* 国家/地区：支持代码(CN) 与 英文全称(China) */
  if (lc === 'country' || lc === 'country_name' || lc === 'countryname' || lc === 'cc' || lc === 'country_code'){ return CN_COUNTRIES[v] || CN_ISO2[String(v).toUpperCase()] || v; }
  /* 省/自治区/直辖市/特别行政区：支持字母码(HA) 与 英文全称(Henan) */
  if (lc === 'province_code' || lc === 'region_code' || lc === 'prov' || lc === 'state_code' || lc === 'region'){
    _lastProv = v.toUpperCase();
    return CN_PROV_ABBREV[_lastProv] || v;
  }
  /* 城市：不再用静态表，原值交 baiduTranslateRemaining 走百度翻译（删表回退时显示英文） */
  if (lc === 'city'){ return v; }
  return v;
}
/* 自适应取值：完整路径 -> 末段字段名 -> 别名兜底 */
function resolveVal(flat, name){
  name = String(name).trim();
  if (flat[name] !== undefined && flat[name] !== null && flat[name] !== '') return fmtVal(flat[name]);
  var seg = name.split('.').pop();
  for (var key in flat){
    if (key.split('.').pop() === seg && flat[key] !== undefined && flat[key] !== null && flat[key] !== '') {
      var fv = fmtVal(flat[key]);
      if (fv !== '') return fv;
    }
  }
  var al = ALIASES[name];
  if (al){ for (var i=0;i<al.length;i++){ var v = resolveVal(flat, al[i]); if (v) return v; } }
  return '';
}
/* 空占位符先打标记，再连同紧邻的分隔符一并清除。
 * 用标记而非无差别正则，避免误伤数据本身的符号（如西经 -118.27、IP 段的 " - "）。 */
var EMPTY_MARK = '\u0000';
function cleanup(text){
  return text.replace(/\s*[,，\-\/、]?\s*\u0000\s*[,，\-\/、]?\s*/g, ' ')
             .replace(/#+/g,' ')
             .replace(/（\s*）/g,'').replace(/\(\s*\)/g,'')
             .replace(/\s*（\s*/g,'（').replace(/\s*）\s*/g,'）')
             .replace(/^AS\s*$/,'')                    /* ASN 全落空只剩前缀 */
             .replace(/\s{2,}/g,' ').trim();
}
/* IP 行：按返回值自动判定协议，改写标签为 IPv4 / IPv6 */
function markIpProto(span, val){
  var row = span.parentNode;
  var lbl = row && row.querySelector ? row.querySelector('.ip-lbl') : null;
  if (!lbl) return;
  var v = String(val || '').trim();
  if (/^(\d{1,3}\.){3}\d{1,3}$/.test(v)){ lbl.innerText = 'IPv4'; lbl.setAttribute('data-proto','4'); }
  else if (v.indexOf(':') > -1 && /^[0-9a-fA-F:.]+$/.test(v)){ lbl.innerText = 'IPv6'; lbl.setAttribute('data-proto','6'); }
  else { lbl.innerText = 'IP'; lbl.removeAttribute('data-proto'); }
}
/* 定位字段所在行，供空值隐藏使用 */
function rowEl(span){
  if (span.closest){ var r = span.closest('.f-row, .ip-row, .ip-sub'); if (r) return r; }
  return span.parentNode;
}
function setRow(span, visible){
  var r = rowEl(span);
  if (r && r.style) r.style.display = visible ? '' : 'none';
}
function protoOf(v){
  v = String(v == null ? '' : v).trim();
  if (/^(\d{1,3}\.){3}\d{1,3}$/.test(v)) return 'IPv4';
  if (v.indexOf(':') > -1 && /^[0-9a-fA-F:.]+$/.test(v)) return 'IPv6';
  return 'IP';
}
/* 双栈/多 IP 源会用逗号或空格返回多个地址（如 "IPv6, IPv4"），拆成独立行 */
function splitIps(text){
  return String(text || '').split(/[,\s]+/).map(function(s){ return s.trim(); })
         .filter(function(s){ return s; });
}
function fillSpan(span, json){
  var tpl = span.getAttribute('data-tpl') || '{ip}';
  var data = (typeof json === 'string') ? (safeJson(json) || {}) : (json || {});
  var flat = flatten(data);
  var text = tpl.replace(/\{([^}]+)\}/g, function(_, name){
    var raw = resolveVal(flat, name);
    raw = cnGeo(name, raw);
    return raw || EMPTY_MARK;
  });
  text = cleanup(text);
  if (span.getAttribute('data-role') === 'ip'){
    var ips = splitIps(text);
    var box = span.closest ? span.closest('.box-info') : null;
    /* 先清掉上一次渲染产生的子 IP 行，避免重复追加（搜索复用场景） */
    if (box){
      var oldSubs = box.querySelectorAll('.ip-sub');
      for (var si = 0; si < oldSubs.length; si++){ if (oldSubs[si].parentNode) oldSubs[si].parentNode.removeChild(oldSubs[si]); }
    }
    span.innerText = ips[0] || '未获取';   /* IP 行始终保留，卡片不会整张空掉 */
    markIpProto(span, ips[0]);
    setRow(span, true);
    /* 多个 IP 时，其余的各自独立成行，并带协议标签 */
    if (box && ips.length > 1){
      var ipRow = span.closest ? span.closest('.ip-row') : span.parentNode;
      for (var mi = 1; mi < ips.length; mi++){
        var sub = document.createElement('div');
        sub.className = 'ip-sub';
        var sl = document.createElement('span');
        sl.className = 'ip-lbl';
        var pr = protoOf(ips[mi]);
        sl.innerText = pr;
        if (pr === 'IPv4') sl.setAttribute('data-proto', '4');
        else if (pr === 'IPv6') sl.setAttribute('data-proto', '6');
        var sv = document.createElement('span');
        sv.className = 'ip-val';
        sv.innerText = ips[mi];
        sub.appendChild(sl);
        sub.appendChild(document.createTextNode('：'));
        sub.appendChild(sv);
        if (ipRow && ipRow.parentNode) ipRow.parentNode.insertBefore(sub, ipRow.nextSibling);
        else box.appendChild(sub);
      }
    }
  } else {
    span.innerText = text;
    setRow(span, !!text);               /* 该源未返回此字段 -> 整行隐藏 */
  }
}
function failSpan(span){
  if (span.getAttribute('data-role') !== 'ip'){ span.innerText = ''; setRow(span, false); return; }
  span.innerText = '数据获取出错';
  markIpProto(span, '');
  setRow(span, true);
}
/* 字段派生：部分源把"运营商"拼接在地址后（如太平洋 addr="浙江省杭州市 电信"）。
 * DERIVE / DERIVE_RULES / applyDerive 已外置到 ./cards.js（与 IP_CARDS/CONN_CARDS/setCardOpt/sortIpCards 同文件，仿 tables.js 模式）。 */
/* JSONP：绕过 CORS，并可按 data-charset 正确解码 GBK 等编码。
 * 回调名内部自动生成唯一全局名（__jp_<n>），避免卡片属性写死导致命名冲突；卡片仅需声明 jsonp:true */
var _jpSeq = 0;
function fetchJsonp(url, charset){
  return new Promise(function(resolve, reject){
    var cbName = '__jp_' + (++_jpSeq);
    var s = document.createElement('script'), done = false, prev = window[cbName];
    function clean(){ window[cbName] = prev; if (s.parentNode) s.parentNode.removeChild(s); }
    window[cbName] = function(data){ done = true; clean(); resolve(data); };
    s.src = url; if (charset) s.charset = charset;
    s.onerror = function(){ if(!done){ clean(); reject(new Error('jsonp error')); } };
    setTimeout(function(){ if(!done){ clean(); reject(new Error('jsonp timeout')); } }, REQ_TIMEOUT);
    document.head.appendChild(s);
  });
}
function fetchJson(url, opt){
  opt = opt || {};
  if (opt.jsonp) return fetchJsonp(url, opt.charset);
  /* 纯文本源（如 ipinfo.io/ip 直接返回裸 IP 文本）：取文本后包成 {ip} 供模板复用 */
  if (opt.plain && typeof fetch !== 'undefined'){
    var acp = new AbortController();
    var tp = setTimeout(function(){ acp.abort(); }, REQ_TIMEOUT);
    return fetch(url, { signal: acp.signal }).then(function(r){ clearTimeout(tp); return r.text(); })
      .then(function(txt){ return { ip: (txt || '').trim() }; })
      .catch(function(){ return {}; });
  }
  if (typeof AbortController !== 'undefined' && typeof fetch !== 'undefined'){
    var ac = new AbortController();
    var t = setTimeout(function(){ ac.abort(); }, REQ_TIMEOUT);
    var fopt = { signal: ac.signal };
    /* POST 型源（如 whatismyip）：带 method/body，其余走默认 GET */
    if (opt.method && String(opt.method).toUpperCase() === 'POST'){
      fopt.method = 'POST';
      fopt.headers = { 'Content-Type': 'application/json' };
      fopt.body = (opt.body != null) ? opt.body : '{}';
    }
    return fetch(url, fopt).then(function(r){ clearTimeout(t); return r.text(); })
      .then(function(txt){ return safeJson(txt) || {}; });
  }
  return Promise.reject(new Error('no fetch'));
}
function spanOpt(span){
  return { jsonp: span.getAttribute('data-jsonp'), charset: span.getAttribute('data-charset'), plain: span.getAttribute('data-plain'),
           method: span.getAttribute('data-method'), body: span.getAttribute('data-body') };
}
/* 百度翻译兜底：把归属地中的英文（省/州、城市等）逐词组翻成中文。
 * 国家/地区由 CN_COUNTRIES / CN_ISO2 静态表即时翻译（零调用）；运营商(ISP)由 CN_ISP_ABBR 静态表处理（见下方 isIspSpan 分支）。
 * 策略：遍历 f-row 内字段，提取"连续英文字母词组"（如 California、Los Angeles、China Unicom），含数字的 ASN 前缀不单独翻；纯数字/坐标不翻。
 * 一次批量送 Worker（./cf-mt-worker.js/mt/text）；结果按英文词缓存（_mtCache），二次加载命中直接回填、不发 Worker，省配额。BAIDU_WORKER 留空则整段跳过，退回英文原值。 */
var _mtCache = {};   // 英文词组 -> 中文（命中直接回填，不发 Worker）
async function baiduTranslateRemaining(){
  if (!BAIDU_WORKER) return;
  var tokenMap = {};   // 英文词组 -> [元素]
  var tokens = [];
  var nodes = document.querySelectorAll('.f-row span[data-tpl]');
  Array.prototype.forEach.call(nodes, function(el){
    var t = (el.textContent || '').trim();
    if (!t) return;
    /* ASN 字段不翻译（AS+数字 或字段模板含 asn，翻译后反而不易识别） */
    var tpl = el.getAttribute('data-tpl') || '';
    var isIspSpan = /isp|llc|asorganization|asorg/i.test(tpl);
    if (/^AS\d+/i.test(t)) return;
    /* 提取连续英文字母组成的词组（可含空格，如 "Los Angeles"）；排除含数字/标点的片段 */
    var re = /[A-Za-z]+(?:\s+[A-Za-z]+)*/g, ms = t.match(re) || [];
    ms.forEach(function(w){
      w = w.trim();
      if (w.length < 2) return;
      if (isIspSpan){
        if (CN_ISP_ABBR[w] !== undefined){ el.textContent = el.textContent.split(w).join(CN_ISP_ABBR[w]); }
        return;
      }
      /* 翻译缓存命中：直接回填，不发 Worker */
      if (_mtCache[w] !== undefined){ if (el.textContent.indexOf(w) > -1) el.textContent = el.textContent.split(w).join(_mtCache[w]); return; }
      if (!tokenMap[w]){ tokenMap[w] = []; tokens.push(w); }
      tokenMap[w].push(el);
    });
  });
  if (!tokens.length) return;
  tokens.sort();   // 排序以稳定缓存键，提升命中率
  try{
    var r = await fetch(BAIDU_WORKER + '/mt/text', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ q: tokens.join('\n'), from:'auto', to:'zh' })
    });
    if (!r.ok) return;
    var j = await r.json();
    var list = j.results || [];            // 与 tokens 下标对齐
    tokens.forEach(function(tok, i){
      var item = list[i];
      var zh = item && item.dst ? item.dst.trim() : '';
      if (!zh || zh === tok) return;
      _mtCache[tok] = zh;   // 写入缓存，二次加载命中直接回填
      Array.prototype.forEach.call(tokenMap[tok], function(el){
        if (el.textContent.indexOf(tok) > -1) el.textContent = el.textContent.split(tok).join(zh);
      });
    });
  }catch(e){ /* 翻译失败不影响展示，保留英文原文 */ }
}
function loadSpanP(span){
  var url = span.getAttribute('data-api');
  if (!url) return Promise.resolve();
  return fetchJson(url, spanOpt(span)).then(function(d){ fillSpan(span, d); }).catch(function(){ failSpan(span); });
}
/* 单卡加载（抽出自 loadAll，供懒加载复用）：块级容器拉一次回填子 span；span 级独立请求 */
function loadBox(el){
  if (el.tagName === 'SPAN'){ return loadSpanP(el); }
  var kids = el.querySelectorAll('span[data-tpl]:not([data-api])');
  var p = fetchJson(el.getAttribute('data-api'), spanOpt(el))
    .then(function(d){ var dd = applyDerive(el, d); Array.prototype.forEach.call(kids, function(sp){ fillSpan(sp, dd); }); })
    .catch(function(){ Array.prototype.forEach.call(kids, failSpan); });
  Array.prototype.forEach.call(el.querySelectorAll('span[data-api]'), function(s){ p = Promise.all([p, loadSpanP(s)]); });
  return p;
}
/* 错峰队列：每批 5 个、批间 ~120ms，抑制首屏 20+ 并发 */
var _lazyQueue = [], _lazyPump = false;
function _pump(){
  if (_lazyPump) return;
  if (!_lazyQueue.length){ _lazyPump = false; return; }
  _lazyPump = true;
  (function step(){
    if (!_lazyQueue.length){ _lazyPump = false; return; }
    var batch = _lazyQueue.splice(0, 5);
    batch.forEach(function(item){ loadBox(item.el).then(item.after); });
    setTimeout(step, 120);
  })();
}
function _inView(box){
  if (typeof box.getBoundingClientRect !== 'function') return true;
  var r = box.getBoundingClientRect();
  var h = window.innerHeight || (document.documentElement && document.documentElement.clientHeight) || 0;
  return r.top < h && r.bottom > 0;
}
function loadAll(){
  var els = Array.prototype.slice.call(document.querySelectorAll('[data-api]'));
  if (!('IntersectionObserver' in window)){
    /* 兜底：无 IO 支持的旧浏览器，保持原全量并发行为 */
    return Promise.all(els.map(loadBox));
  }
  var afterOne = function(){ baiduTranslateRemaining(); measureClip(); fitLabelWidths(); };
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      var box = e.target;
      var targets = box.matches('[data-api]') ? [box] : Array.prototype.slice.call(box.querySelectorAll('[data-api]'));
      targets.forEach(function(el){ _lazyQueue.push({ el: el, after: afterOne }); });
      _pump();
    });
  }, { rootMargin: '200px' });
  var first = [];
  els.forEach(function(el){
    var box = el.closest('.box') || el;
    if (_inView(box)){ first.push(loadBox(el).then(afterOne)); }
    else { io.observe(box); }
  });
  return Promise.all(first);
}
/* 搜索框归属地查询（#4 决策：保留 api.ip.sb + ipwho.is 兜底）。
 * 主源 api.ip.sb/geoip/ 实测可用且开放 CORS；失败时兜底 ipwho.is（免key、CORS开放）。
 * ipwho.is 不含 asn/isp，fillSpan 会自动隐藏对应行，核心地址/经纬度正常显示。 */
function isValidGeo(d){ return d && typeof d === 'object' && (d.ip || d.country || d.city); }
function normalizeIpwho(d){
  return {
    ip: d.ip, country: d.country, region: d.region, city: d.city,
    longitude: d.longitude, latitude: d.latitude,
    asn: '', asn_organization: '', isp: ''
  };
}
/* 搜索源配置化（P5）：依次尝试，任一有效即采用；加搜索源 = 加数组项，无需改函数体。
 * api: 查询接口；normalize: 可选，把响应规整为 {ip,country,region,city,longitude,latitude,...} 统一字段 */
var SEARCH_SOURCES = [
  { api: function(ip){ return "https://api.ip.sb/geoip/" + ip; } },
  { api: function(ip){ return "https://ipwho.is/" + ip; }, normalize: normalizeIpwho }
];
function queryGeoIp(term){
  var ip = encodeURIComponent(term);
  var lastErr = null;
  return SEARCH_SOURCES.reduce(function(chain, src){
    return chain.catch(function(){ return fetchJson(src.api(ip)).then(function(d){
      if (!isValidGeo(d)) throw new Error('source invalid');
      return src.normalize ? src.normalize(d) : d;
    }).catch(function(e){ lastErr = e; throw e; }); });
  }, Promise.reject(new Error('no search source')));
}
function search(){
  var term = document.getElementById("searchInput").value;
  if (term == ""){ alert("请先输入搜索 IP！"); return false; }
  var box = document.getElementById("search");
  box.style.display = "block";
  fitLabelWidths(box);
  var spans = box.querySelectorAll('span[data-tpl]');
  queryGeoIp(term)
    .then(function(d){ Array.prototype.forEach.call(spans, function(sp){ fillSpan(sp, d); }); })
    .catch(function(){ Array.prototype.forEach.call(spans, failSpan); })
    .then(baiduTranslateRemaining).then(measureClip).then(function(){ fitLabelWidths(box); });
  return false;
}
/* 全部内容行单行截断 + 点击展开：含 IP 行(.ip-row)与非 IP 行(.f-row)；仅溢出行加右侧渐隐遮罩(.clip)，点击整行切换 .open 在下方显示完整 */
function measureClip(){
  Array.prototype.forEach.call(document.querySelectorAll('.f-row, .ip-row'), function(row){
    var sp = row.querySelector('span[data-tpl]');
    if (!sp) return;
    var wasOpen = row.classList.contains('open');
    if (wasOpen) row.classList.remove('open');
    var over = sp.scrollWidth > sp.clientWidth + 1;
    if (over){
      row.classList.add('clip');
      var ef = row.querySelector('.expfull');
      if (!ef){ ef = document.createElement('div'); ef.className = 'expfull'; row.appendChild(ef); }
      ef.textContent = sp.textContent;
    } else {
      row.classList.remove('clip');
      var ef2 = row.querySelector('.expfull'); if (ef2) ef2.parentNode.removeChild(ef2);
    }
    if (wasOpen) row.classList.add('open');
  });
}
document.addEventListener('click', function(e){
  var row = e.target.closest ? e.target.closest('.f-row, .ip-row') : null;
  if (row && row.classList.contains('clip')) row.classList.toggle('open');
});
window.addEventListener('resize', function(){ fitLabelWidths(); measureClip(); });


/* ===== IP 卡片数组绑定（v7 重构）：用数据数组生成卡片 DOM，消除重复 HTML =====
 * IP_CARDS / CONN_CARDS / DERIVE / DERIVE_RULES / applyDerive / setCardOpt / sortIpCards 已外置到 ./cards.js（仿 tables.js）。
 * 下方 renderCardRow / renderIpCards / fitLabelWidths / renderConnCards 为本页渲染引擎，调用 cards.js 导出的全局。 */
function renderCardRow(r){
  if (r.ip){
    var row = document.createElement('div'); row.className = 'ip-row';
    var lbl = document.createElement('span'); lbl.className = 'ip-lbl'; lbl.textContent = r.label || 'IP';
    var val = document.createElement('span'); val.className = 'ip-val';
    val.setAttribute('data-role', 'ip'); val.setAttribute('data-tpl', r.tpl); val.textContent = '测试中...';
    if (r.api) val.setAttribute('data-api', r.api);
    setCardOpt(val, r.opt);
    row.appendChild(lbl); row.appendChild(document.createTextNode('：')); row.appendChild(val);
    if (r.tag){ row.appendChild(document.createTextNode(' ')); var tg = document.createElement('span'); tg.className = 'src-tag'; tg.textContent = r.tag; row.appendChild(tg); }
    return row;
  }
  var row = document.createElement('div'); row.className = 'f-row';
  var lbl = document.createElement('span'); lbl.className = 'ip-lbl'; lbl.textContent = r.label;
  row.appendChild(lbl); row.appendChild(document.createTextNode('：'));
  var span = document.createElement('span'); span.setAttribute('data-tpl', r.tpl); span.textContent = '测试中...';
  row.appendChild(span);
  return row;
}
/* IP 卡片排序：数据行数从多到少（descending）；同行数按 id 字典序稳定排序。
 * 聚合卡 src-domestic / src-overseas 锁末两位（不进入行数排序）。返回新数组，不改原配置。 */
function sortIpCards(list){
  var agg = ['src-domestic', 'src-overseas'];
  var mains = list.filter(function(c){ return agg.indexOf(c.id) < 0; });
  var tails = list.filter(function(c){ return agg.indexOf(c.id) >= 0; });
  mains.sort(function(a, b){
    var ra = (a.rows ? a.rows.length : 0), rb = (b.rows ? b.rows.length : 0);
    if (rb !== ra) return rb - ra;                       /* 行数多者在前 */
    return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);    /* 同行数按 id 字典序 */
  });
  return mains.concat(tails);
}
function renderIpCards(list, mount){
  list.forEach(function(cfg){
    var box = document.createElement('div'); box.className = 'box';
    var title = document.createElement('div'); title.className = 'box-title'; title.textContent = cfg.title; box.appendChild(title);
    var info = document.createElement('div'); info.className = 'box-info'; info.id = cfg.id;
    if (cfg.api) info.setAttribute('data-api', cfg.api);
    setCardOpt(info, cfg.opt);
    /* CLS 防抖：按行数预留最小高度，使占位态与回填态高度接近，消除异步回填行高抖动 */
    info.style.minHeight = ((cfg.rows ? cfg.rows.length : 1) * 2.5 + 0.5) + 'em';
    (cfg.rows || []).forEach(function(r){ info.appendChild(renderCardRow(r)); });
    box.appendChild(info); mount.appendChild(box);
  });
}
function fitLabelWidths(scope){
  var containers = scope ? [scope] : Array.prototype.slice.call(document.querySelectorAll('.box-info'));
  containers.forEach(function(info){
    if (info.offsetParent === null) return;
    var labels = info.querySelectorAll('.ip-lbl');
    if (!labels.length) return;
    Array.prototype.forEach.call(labels, function(l){ l.style.width = 'auto'; });
    var max = 0;
    Array.prototype.forEach.call(labels, function(l){
      var w = l.getBoundingClientRect().width;
      if (w > max) max = w;
    });
    Array.prototype.forEach.call(labels, function(l){ l.style.width = ''; });
    /* 仅写入真实测得宽度；max<=0 说明字体未就绪/瞬时隐藏（不可测），保留上一次值，
       不再回退固定 42px。多 IP 行动态追加的 IPv4/IPv6 子标签由调用方在回填后触发重算 */
    if (max > 0) info.style.setProperty('--lbl-w', Math.ceil(max) + 'px');
  });
}
function renderConnCards(list, mount){
  list.forEach(function(c){
    var box = document.createElement('div'); box.className = 'box';
    var title = document.createElement('div'); title.className = 'box-title'; title.textContent = c.title;
    var ico = document.createElement('span'); ico.id = c.id + '-ico'; title.appendChild(ico);
    box.appendChild(title);
    var info = document.createElement('div'); info.className = 'box-info'; info.id = c.id;
    info.style.minHeight = (2 * 2.5 + 0.5) + 'em';   /* 连通性卡固定 2 行：状态/延迟 */
    var r1 = document.createElement('div'); r1.appendChild(document.createTextNode('状态：'));
    var fl = document.createElement('span'); fl.id = c.id + '-flag'; fl.textContent = '测试中...'; r1.appendChild(fl);
    var r2 = document.createElement('div'); r2.appendChild(document.createTextNode('延迟：'));
    var ms = document.createElement('span'); ms.id = c.id + '-ms'; ms.textContent = '0'; r2.appendChild(ms); r2.appendChild(document.createTextNode('ms'));
    info.appendChild(r1); info.appendChild(r2);
    box.appendChild(info); mount.appendChild(box);
  });
}
/* CONN_CARDS 已外置 ./cards.js；此处直接调用全局 */
renderIpCards(sortIpCards(IP_CARDS), document.getElementById('ipInfo'));
renderConnCards(CONN_CARDS, document.getElementById('connInfo'));
fitLabelWidths();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabelWidths);
window.addEventListener('load', fitLabelWidths);

loadAll().then(baiduTranslateRemaining).catch(baiduTranslateRemaining).then(measureClip).then(fitLabelWidths);

/* 连通性失败时兜底图标：内联 SVG（灰叉），不依赖外部图片，避免 404 */
var ERR_ICON = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="none" stroke="%239aa0a6" stroke-width="1.5"/><path d="M4.5 4.5l5 5M9.5 4.5l-5 5" stroke="%239aa0a6" stroke-width="1.5" stroke-linecap="round"/></svg>');
function testWeb(url, id, img_path) {const startTime=performance.now();const img=new Image();let done=false;const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;const timeout=setTimeout(()=>{if(done)return;done=true;handleFailure('连接超时（5秒）');},5000);function handleSuccess(){if(done)return;done=true;clearTimeout(timeout);if(ctrl)ctrl.abort();const endTime=performance.now();const duration=(endTime-startTime).toFixed(0);document.getElementById(id+"-flag").innerText="可用";document.getElementById(id+"-ms").innerText=Math.floor(duration);document.getElementById(id+"-ico").innerHTML='<img src="'+img_path+'" onerror="this.src=\''+ERR_ICON+'\'" alt="'+id+'"/>'}function handleFailure(reason){if(done)return;done=true;clearTimeout(timeout);if(ctrl)ctrl.abort();document.getElementById(id+"-flag").innerText="数据获取出错";document.getElementById(id+"-ico").innerHTML='<img src="'+ERR_ICON+'" alt="'+id+'"/>'}fetch(url,{mode:'no-cors',cache:'no-store',signal:(ctrl?ctrl.signal:undefined)}).then(handleSuccess).catch((err)=>{if(done)return;console.log(err);img.onload=handleSuccess;img.onerror=()=>handleFailure('无法加载网站');img.src=url})}const requests_img = CONN_CARDS.map(function(c){ return { url: c.url, id: c.id, img: c.img }; });requests_img.forEach(function(o){ testWeb(o.url, o.id, o.img); });
</script>
