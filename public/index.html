<script src="./tables.js"></script>
<script>
/* ===== 统一自适应读取与回填 v3 =====
 * 每个块通过 data-api 声明接口地址，data-tpl 声明回填模板，
 * 由本段 JS 统一拉取、自适应解析 JSON 并填入对应块。
 * 可选属性：data-jsonp（JSONP 回调名）/ data-charset（脚本编码）
 */
var REQ_TIMEOUT = 10000;  /* 单个请求超时(ms) */
var BAIDU_WORKER = './cf-mt-worker.js';     /* 百度翻译代理 Worker（相对路径：需 Cloudflare 在本页域名（即 location.hostname）上把 /cf-mt-worker.js* 路由到该 Worker，才能同域调用）；留空则不翻译，退回静态表/英文 */

function flatten(obj, prefix, out){
  out = out || {};
  if (obj && typeof obj === 'object' && !Array.isArray(obj)){
    var keys = Object.keys(obj);
    if (keys.length === 0){ out[prefix] = obj; }
    else { for (var i=0;i<keys.length;i++){ flatten(obj[keys[i]], prefix ? prefix+'.'+keys[i] : keys[i], out); } }
  } else { out[prefix] = obj; }
  return out;
}
/* 容错解析：纯 JSON -> JSONP/前缀包裹 -> 逐个大括号做配平扫描，取能解析出的最大对象 */
function safeJson(s){
  if (s && typeof s === 'object') return s;
  s = String(s);
  try { return JSON.parse(s); } catch(e){}
  var best = null, bestLen = 0;
  for (var i=0;i<s.length;i++){
    if (s.charAt(i) !== '{') continue;
    var depth=0, inStr=false, esc=false;
    for (var j=i;j<s.length;j++){
      var c = s.charAt(j);
      if (esc){ esc=false; continue; }
      if (c === '\\'){ esc=true; continue; }
      if (c === '"'){ inStr = !inStr; continue; }
      if (inStr) continue;
      if (c === '{') depth++;
      else if (c === '}'){
        depth--;
        if (depth === 0){
          var frag = s.slice(i, j+1);
          try {
            var o = JSON.parse(frag);
            if (o && typeof o === 'object' && frag.length > bestLen){ best = o; bestLen = frag.length; }
          } catch(e2){}
          break;
        }
      }
    }
  }
  return best;
}
function fmtVal(v){
  if (v === null || v === undefined) return '';
  if (Array.isArray(v)) return v.filter(function(x){ return x !== '' && x != null; }).join(' ');
  return (typeof v === 'object') ? '' : String(v);
}
/* 字段别名兜底（不含自身键，防止递归） */
/* 静态表（ALIASES / CN_COUNTRIES / CN_ISO2 / CN_PROV_GBT2260 / CN_ISP_ABBR 及其派生 CN_PROV_ABBREV）
 * 已外置到 ./tables.js，由下方 <script src> 在主线脚本前载入为全局变量。 */


/* 地理字段中文化：按字段类型选对应映射（仅匹配英文键，已中文源不误伤） */
var _lastProv = '';
function cnGeo(name, val){
  if (val === undefined || val === null || val === '') return val;
  var lc = String(name).split('.').pop().trim().toLowerCase();
  var v = String(val).trim();
  /* 国家/地区：支持代码(CN) 与 英文全称(China) */
  if (lc === 'country' || lc === 'country_name' || lc === 'countryname' || lc === 'cc' || lc === 'country_code'){ return CN_COUNTRIES[v] || CN_ISO2[String(v).toUpperCase()] || v; }
  /* 省/自治区/直辖市/特别行政区：支持字母码(HA) 与 英文全称(Henan) */
  if (lc === 'province_code' || lc === 'region_code' || lc === 'prov' || lc === 'state_code' || lc === 'region'){
    _lastProv = v.toUpperCase();
    return CN_PROV_ABBREV[_lastProv] || v;
  }
  /* 城市：不再用静态表，原值交 baiduTranslateRemaining 走百度翻译（删表回退时显示英文） */
  if (lc === 'city'){ return v; }
  return v;
}
/* 自适应取值：完整路径 -> 末段字段名 -> 别名兜底 */
function resolveVal(flat, name){
  name = String(name).trim();
  if (flat[name] !== undefined && flat[name] !== null && flat[name] !== '') return fmtVal(flat[name]);
  var seg = name.split('.').pop();
  for (var key in flat){
    if (key.split('.').pop() === seg && flat[key] !== undefined && flat[key] !== null && flat[key] !== '') {
      var fv = fmtVal(flat[key]);
      if (fv !== '') return fv;
    }
  }
  var al = ALIASES[name];
  if (al){ for (var i=0;i<al.length;i++){ var v = resolveVal(flat, al[i]); if (v) return v; } }
  return '';
}
/* 空占位符先打标记，再连同紧邻的分隔符一并清除。
 * 用标记而非无差别正则，避免误伤数据本身的符号（如西经 -118.27、IP 段的 " - "）。 */
var EMPTY_MARK = '\u0000';
function cleanup(text){
  return text.replace(/\s*[,，\-\/、]?\s*\u0000\s*[,，\-\/、]?\s*/g, ' ')
             .replace(/#+/g,' ')
             .replace(/（\s*）/g,'').replace(/\(\s*\)/g,'')
             .replace(/\s*（\s*/g,'（').replace(/\s*）\s*/g,'）')
             .replace(/^AS\s*$/,'')
             .replace(/\s{2,}/g,' ').trim();
}
/* IP 行：按返回值自动判定协议，改写标签为 IPv4 / IPv6 */
function markIpProto(span, val){
  var row = span.parentNode;
  var lbl = row && row.querySelector ? row.querySelector('.ip-lbl') : null;
  if (!lbl) return;
  var v = String(val || '').trim();
  if (/^(\d{1,3}\.){3}\d{1,3}$/.test(v)){ lbl.innerText = 'IPv4'; lbl.setAttribute('data-proto','4'); }
  else if (v.indexOf(':') > -1 && /^[0-9a-fA-F:.]+$/.test(v)){ lbl.innerText = 'IPv6'; lbl.setAttribute('data-proto','6'); }
  else { lbl.innerText = 'IP'; lbl.removeAttribute('data-proto'); }
}
/* 定位字段所在行，供空值隐藏使用 */
function rowEl(span){
  if (span.closest){ var r = span.closest('.f-row, .ip-row, .ip-sub'); if (r) return r; }
  return span.parentNode;
}
function setRow(span, visible){
  var r = rowEl(span);
  if (r && r.style) r.style.display = visible ? '' : 'none';
}
function protoOf(v){
  v = String(v == null ? '' : v).trim();
  if (/^(\d{1,3}\.){3}\d{1,3}$/.test(v)) return 'IPv4';
  if (v.indexOf(':') > -1 && /^[0-9a-fA-F:.]+$/.test(v)) return 'IPv6';
  return 'IP';
}
/* 双栈/多 IP 源会用逗号或空格返回多个地址（如 "IPv6, IPv4"），拆成独立行 */
function splitIps(text){
  return String(text || '').split(/[,\s]+/).map(function(s){ return s.trim(); })
         .filter(function(s){ return s; });
}
function fillSpan(span, json){
  var tpl = span.getAttribute('data-tpl') || '{ip}';
  var data = (typeof json === 'string') ? (safeJson(json) || {}) : (json || {});
  var flat = flatten(data);
  var text = tpl.replace(/\{([^}]+)\}/g, function(_, name){
    var raw = resolveVal(flat, name);
    raw = cnGeo(name, raw);
    return raw || EMPTY_MARK;
  });
  text = cleanup(text);
  if (span.getAttribute('data-role') === 'ip'){
    var ips = splitIps(text);
    var box = span.closest ? span.closest('.box-info') : null;
    /* 先清掉上一次渲染产生的子 IP 行，避免重复追加（搜索复用场景） */
    if (box){
      var oldSubs = box.querySelectorAll('.ip-sub');
      for (var si = 0; si < oldSubs.length; si++){ if (oldSubs[si].parentNode) oldSubs[si].parentNode.removeChild(oldSubs[si]); }
    }
    span.innerText = ips[0] || '未获取';   /* IP 行始终保留，卡片不会整张空掉 */
    markIpProto(span, ips[0]);
    setRow(span, true);
    /* 多个 IP 时，其余的各自独立成行，并带协议标签 */
    if (box && ips.length > 1){
      var ipRow = span.closest ? span.closest('.ip-row') : span.parentNode;
      for (var mi = 1; mi < ips.length; mi++){
        var sub = document.createElement('div');
        sub.className = 'ip-sub';
        var sl = document.createElement('span');
        sl.className = 'ip-lbl';
        var pr = protoOf(ips[mi]);
        sl.innerText = pr;
        if (pr === 'IPv4') sl.setAttribute('data-proto', '4');
        else if (pr === 'IPv6') sl.setAttribute('data-proto', '6');
        var sv = document.createElement('span');
        sv.className = 'ip-val';
        sv.innerText = ips[mi];
        sub.appendChild(sl);
        sub.appendChild(document.createTextNode('：'));
        sub.appendChild(sv);
        if (ipRow && ipRow.parentNode) ipRow.parentNode.insertBefore(sub, ipRow.nextSibling);
        else box.appendChild(sub);
      }
    }
  } else {
    span.innerText = text;
    setRow(span, !!text);               /* 该源未返回此字段 -> 整行隐藏 */
  }
}
function failSpan(span){
  if (span.getAttribute('data-role') !== 'ip'){ span.innerText = ''; setRow(span, false); return; }
  span.innerText = '数据获取出错';
  markIpProto(span, '');
  setRow(span, true);
}
/* 字段派生：部分源把"运营商"拼接在地址后（如太平洋 addr="浙江省杭州市 电信"）。
 * 在此按最后一个空格拆出独立字段，供模板单独使用。key 为块容器 id。 */
var DERIVE = {
  'src-pconline': function(d){
    var v = (d.addr != null) ? d.addr : (d.pro != null ? d.pro : '');
    var s = String(v).replace(/^\s+/, '').trim();   /* 去前导空格（如海外 IP " 美国"） */
    if (!s) return;
    var idx = s.lastIndexOf(' ');
    if (idx > 0){ d.addr_addr = s.slice(0, idx).trim(); d.addr_isp = s.slice(idx+1).trim(); }
    else { d.addr_addr = s; d.addr_isp = ''; }
  },
  /* ipip.net：location 为数组，末项是运营商，其余拼为地址 */
  'src-ipipnet': function(d){
    var loc = d.data && d.data.location;
    if (!Array.isArray(loc) || !loc.length) return;
    d.loc_isp = (loc[loc.length - 1] == null ? '' : String(loc[loc.length - 1])).trim();
    d.loc_addr = loc.slice(0, -1)
      .filter(function(x){ return x !== '' && x != null; })
      .join(' ').replace(/\s+/g, ' ').trim();
  },
  /* 爱奇艺：t = "CMNET|HeNan_ZhengZhou-111.6.193.195" => [ISP码]|[省_市拼音]-[IP]
   * 地址/运营商原值（拼音/英文）交 baiduTranslateRemaining 走百度翻译；Worker 失效时按用户决策回退拼音/英文 */
  'src-iqiyi': function(d){
    var t = d.t;
    if (!t || typeof t !== 'string') return;
    var parts = t.split('|');
    var ispCode = (parts[0] || '').trim();
    var rest = parts[1] || '';
    var m = rest.split('-');
    var geo = (m[0] || '').trim();          /* 省_市 拼音（可能仅省，如 HeNan） */
    var ip = m.slice(1).join('-').trim();
    d.iqiyi_isp = CN_ISP_ABBR[ispCode] || ispCode;   /* 爱奇艺 ISP 码 -> 中文简称（命中静态表显中文，未命中回退原始码） */
    d.iqiyi_addr = geo;      /* 省_市 拼音，交给百度翻译 */
    d.iqiyi_ip = ip;
  },
  /* WhatIsMyIP（wimi-api-v4/v6）：响应包在 data 下，提到顶层供模板直接取；v4/v6 同源双栈，地理一致 */
  'src-wimi': function(d){
    if (d && d.data && typeof d.data === 'object'){
      for (var k in d.data){ if (Object.prototype.hasOwnProperty.call(d.data, k)) d[k] = d.data[k]; }
    }
  },
  /* FreeIPAPI：无独立 ISP 名字段，用 asnOrganization 充当运营商（别名 isp 走 CN_ISP_ABBR 静态表）；
   * 组装 asnLine（AS+编号+组织），避免空值出现 "AS " 残留 */
  'src-freeipapi': function(d){
    if (d.asnOrganization != null) d.isp = d.asnOrganization;
    if (d.asn != null && d.asnOrganization != null) d.asnLine = 'AS' + d.asn + ' ' + d.asnOrganization;
    else if (d.asnOrganization != null) d.asnLine = d.asnOrganization;
  },
  /* GeoJS.io：响应为数组 [{}]，解包首元素为对象供模板取用（applyDerive 返回值被 loadAll 采用） */
  'src-geojs': function(d){
    if (Array.isArray(d) && d[0] && typeof d[0] === 'object'){
      var o = {};
      for (var k in d[0]){ if (Object.prototype.hasOwnProperty.call(d[0], k)) o[k] = d[0][k]; }
      return o;
    }
    return d;
  }
};
function applyDerive(el, d){ var f = DERIVE[el.id]; if (f && d && typeof d === 'object'){ var r = f(d); if (r && typeof r === 'object') return r; } return d; }
/* JSONP：绕过 CORS，并可按 data-charset 正确解码 GBK 等编码 */
function fetchJsonp(url, cbName, charset){
  return new Promise(function(resolve, reject){
    var s = document.createElement('script'), done = false, prev = window[cbName];
    function clean(){ window[cbName] = prev; if (s.parentNode) s.parentNode.removeChild(s); }
    window[cbName] = function(data){ done = true; clean(); resolve(data); };
    s.src = url; if (charset) s.charset = charset;
    s.onerror = function(){ if(!done){ clean(); reject(new Error('jsonp error')); } };
    setTimeout(function(){ if(!done){ clean(); reject(new Error('jsonp timeout')); } }, REQ_TIMEOUT);
    document.head.appendChild(s);
  });
}
function fetchJson(url, opt){
  opt = opt || {};
  if (opt.jsonp) return fetchJsonp(url, opt.jsonp, opt.charset);
  /* 纯文本源（如 ipinfo.io/ip 直接返回裸 IP 文本）：取文本后包成 {ip} 供模板复用 */
  if (opt.plain && typeof fetch !== 'undefined'){
    var acp = new AbortController();
    var tp = setTimeout(function(){ acp.abort(); }, REQ_TIMEOUT);
    return fetch(url, { signal: acp.signal }).then(function(r){ clearTimeout(tp); return r.text(); })
      .then(function(txt){ return { ip: (txt || '').trim() }; })
      .catch(function(){ return {}; });
  }
  if (typeof AbortController !== 'undefined' && typeof fetch !== 'undefined'){
    var ac = new AbortController();
    var t = setTimeout(function(){ ac.abort(); }, REQ_TIMEOUT);
    var fopt = { signal: ac.signal };
    /* POST 型源（如 whatismyip）：带 method/body，其余走默认 GET */
    if (opt.method && String(opt.method).toUpperCase() === 'POST'){
      fopt.method = 'POST';
      fopt.headers = { 'Content-Type': 'application/json' };
      fopt.body = (opt.body != null) ? opt.body : '{}';
    }
    return fetch(url, fopt).then(function(r){ clearTimeout(t); return r.text(); })
      .then(function(txt){ return safeJson(txt) || {}; });
  }
  if (typeof axios !== 'undefined'){
    if (opt.method && String(opt.method).toUpperCase() === 'POST'){
      return axios.post(url, safeJson(opt.body || '{}'), { timeout: REQ_TIMEOUT }).then(function(r){ return r.data; });
    }
    return axios.get(url, { timeout: REQ_TIMEOUT }).then(function(r){ return r.data; });
  }
  return Promise.reject(new Error('no fetch'));
}
function spanOpt(span){
  return { jsonp: span.getAttribute('data-jsonp'), charset: span.getAttribute('data-charset'), plain: span.getAttribute('data-plain'),

}
/* 百度翻译兜底：把静态表未覆盖、仍是英文的地理字段批量翻成中文。
 * 静态 CN_* 表已覆盖常见国家/省/州（零调用、即时），城市/运营商等表外值此处补翻。
 * 经 Worker（./cf-mt-worker.js/mt/text）一次调用完成，结果按内容缓存（重复加载 0 调用）。
 * BAIDU_WORKER 留空则整段跳过，退回静态表/英文，不影响页面。 */
/* 百度翻译兜底：把归属地中的英文（省/州、城市、ASN 等）逐词组翻成中文。
 * 注意：运营商(ISP)字段不在此处翻译——改由 CN_ISP_ABBR 静态表处理，未命中保留英文原值（见下方 isIspSpan 分支）。
 * 国家/地区仍由 CN_COUNTRIES / CN_ISO2 静态表即时翻译（零调用），此处不再处理国家。
 * 策略：遍历所有 f-row 内字段，提取其中"连续英文字母词组"（如 California、Los Angeles、China Unicom、Google LLC），
 *       含数字者（如 ASN 前缀 "AS4837"）不单独翻译，只翻英文部分；纯数字/坐标(IP/经纬度)不翻。
 *       一次批量送 Worker（./cf-mt-worker.js/mt/text），结果按内容缓存。BAIDU_WORKER 留空则整段跳过。 */
async function baiduTranslateRemaining(){
  if (!BAIDU_WORKER) return;
  var tokenMap = {};   // 英文词组 -> [元素]
  var tokens = [];
  var nodes = document.querySelectorAll('.f-row span[data-tpl]');
  Array.prototype.forEach.call(nodes, function(el){
    var t = (el.textContent || '').trim();
    if (!t) return;
    /* ASN 字段不翻译（AS+数字 或字段模板含 asn，翻译后反而不易识别） */
    var tpl = el.getAttribute('data-tpl') || '';
    var isIspSpan = /isp|llc|asorganization|asorg/i.test(tpl);
    if (/^AS\d+/i.test(t)) return;
    /* 提取连续英文字母组成的词组（可含空格，如 "Los Angeles"）；排除含数字/标点的片段 */
    var re = /[A-Za-z]+(?:\s+[A-Za-z]+)*/g, ms = t.match(re) || [];
    ms.forEach(function(w){
      w = w.trim();
      if (w.length < 2) return;
      /* 运营商字段只走静态表 CN_ISP_ABBR：命中即替换为中文简称；未命中保留英文原值，
       * 绝不送百度翻译（避免英文专有名词/公司全称被机器错译为冗长中文，如
       * "China Telecom Corporation" -> "中国电信集团公司"）。这是修复「运营商英文被翻译」的核心。 */
      if (isIspSpan){
        if (CN_ISP_ABBR[w] !== undefined){ el.textContent = el.textContent.split(w).join(CN_ISP_ABBR[w]); }
        return;
      }
      if (!tokenMap[w]){ tokenMap[w] = []; tokens.push(w); }
      tokenMap[w].push(el);
    });
  });
  if (!tokens.length) return;
  tokens.sort();   // 排序以稳定缓存键，提升命中率
  try{
    var r = await fetch(BAIDU_WORKER + '/mt/text', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ q: tokens.join('\n'), from:'auto', to:'zh' })
    });
    if (!r.ok) return;
    var j = await r.json();
    var list = j.results || [];            // 与 tokens 下标对齐
    tokens.forEach(function(tok, i){
      var item = list[i];
      var zh = item && item.dst ? item.dst.trim() : '';
      if (!zh || zh === tok) return;
      Array.prototype.forEach.call(tokenMap[tok], function(el){
        if (el.textContent.indexOf(tok) > -1) el.textContent = el.textContent.split(tok).join(zh);
      });
    });
  }catch(e){ /* 翻译失败不影响展示，保留英文原文 */ }
}
function loadSpanP(span){
  var url = span.getAttribute('data-api');
  if (!url) return Promise.resolve();
  return fetchJson(url, spanOpt(span)).then(function(d){ fillSpan(span, d); }).catch(function(){ failSpan(span); });
}
function loadAll(){
  var proms = [];
  Array.prototype.forEach.call(document.querySelectorAll('[data-api]'), function(el){
    if (el.tagName === 'SPAN'){ proms.push(loadSpanP(el)); return; }
    /* 块级容器：拉一次，回填所有未自带 data-api 的子 span */
    var kids = el.querySelectorAll('span[data-tpl]:not([data-api])');
    var p = fetchJson(el.getAttribute('data-api'), spanOpt(el))
      .then(function(d){ var dd = applyDerive(el, d); Array.prototype.forEach.call(kids, function(sp){ fillSpan(sp, dd); }); })
      .catch(function(){ Array.prototype.forEach.call(kids, failSpan); });
    proms.push(p);
    Array.prototype.forEach.call(el.querySelectorAll('span[data-api]'), function(s){ proms.push(loadSpanP(s)); });
  });
  return Promise.all(proms);
}
/* 搜索框归属地查询（#4 决策：保留 api.ip.sb + ipwho.is 兜底）。
 * 主源 api.ip.sb/geoip/ 实测可用且开放 CORS；失败时兜底 ipwho.is（免key、CORS开放）。
 * ipwho.is 不含 asn/isp，fillSpan 会自动隐藏对应行，核心地址/经纬度正常显示。 */
function isValidGeo(d){ return d && typeof d === 'object' && (d.ip || d.country || d.city); }
function normalizeIpwho(d){
  return {
    ip: d.ip, country: d.country, region: d.region, city: d.city,
    longitude: d.longitude, latitude: d.latitude,
    asn: '', asn_organization: '', isp: ''
  };
}
function queryGeoIp(term){
  var ip = encodeURIComponent(term);
  return fetchJson("https://api.ip.sb/geoip/" + ip)
    .then(function(d){ if (!isValidGeo(d)) throw new Error('primary source invalid'); return d; })
    .catch(function(){
      return fetchJson("https://ipwho.is/" + ip).then(function(d){
        if (!isValidGeo(d)) throw new Error('fallback source invalid');
        return normalizeIpwho(d);
      });
    });
}
function search(){
  var term = document.getElementById("searchInput").value;
  if (term == ""){ alert("请先输入搜索 IP！"); return false; }
  var box = document.getElementById("search");
  box.style.display = "block";
  fitLabelWidths(box);
  var spans = box.querySelectorAll('span[data-tpl]');
  queryGeoIp(term)
    .then(function(d){ Array.prototype.forEach.call(spans, function(sp){ fillSpan(sp, d); }); })
    .catch(function(){ Array.prototype.forEach.call(spans, failSpan); })
    .then(baiduTranslateRemaining).then(measureClip).then(function(){ fitLabelWidths(box); });
  return false;
}
/* 全部内容行单行截断 + 点击展开：含 IP 行(.ip-row)与非 IP 行(.f-row)；仅溢出行加右侧渐隐遮罩(.clip)，点击整行切换 .open 在下方显示完整 */
function measureClip(){
  Array.prototype.forEach.call(document.querySelectorAll('.f-row, .ip-row'), function(row){
    var sp = row.querySelector('span[data-tpl]');
    if (!sp) return;
    var wasOpen = row.classList.contains('open');
    if (wasOpen) row.classList.remove('open');
    var over = sp.scrollWidth > sp.clientWidth + 1;
    if (over){
      row.classList.add('clip');
      var ef = row.querySelector('.expfull');
      if (!ef){ ef = document.createElement('div'); ef.className = 'expfull'; row.appendChild(ef); }
      ef.textContent = sp.textContent;
    } else {
      row.classList.remove('clip');
      var ef2 = row.querySelector('.expfull'); if (ef2) ef2.parentNode.removeChild(ef2);
    }
    if (wasOpen) row.classList.add('open');
  });
}
document.addEventListener('click', function(e){
  var row = e.target.closest ? e.target.closest('.f-row, .ip-row') : null;
  if (row && row.classList.contains('clip')) row.classList.toggle('open');
});
window.addEventListener('resize', measureClip);

function fitLabelWidths(scope){
  var containers = scope ? [scope] : Array.prototype.slice.call(document.querySelectorAll('.box-info'));
  containers.forEach(function(info){
    if (info.offsetParent === null) return;
    var labels = info.querySelectorAll('.ip-lbl');
    if (!labels.length) return;
    Array.prototype.forEach.call(labels, function(l){ l.style.width = 'auto'; });
    var max = 0;
    Array.prototype.forEach.call(labels, function(l){
      var w = l.getBoundingClientRect().width;
      if (w > max) max = w;
    });
    Array.prototype.forEach.call(labels, function(l){ l.style.width = ''; });
    /* 仅写入真实测得宽度；max<=0 说明字体未就绪/瞬时隐藏（不可测），保留上一次值，
       不再回退固定 42px。多 IP 行动态追加的 IPv4/IPv6 子标签由调用方在回填后触发重算 */
    if (max > 0) info.style.setProperty('--lbl-w', Math.ceil(max) + 'px');
  });
}
